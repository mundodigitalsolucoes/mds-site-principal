<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">12 campanhas estratégicas para aumentar o faturamento da sua pizzaria</title>
  <desc id="description">Capa da edição BV+ Pizzarias, por Fábio Alves e Mundo Digital Soluções.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202640"/>
      <stop offset="1" stop-color="#374b89"/>
    </linearGradient>
    <radialGradient id="pizza" cx="45%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e0ae4f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#101426" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1110" cy="70" r="230" fill="#ffffff" opacity=".035"/>
  <circle cx="70" cy="590" r="250" fill="#e0ae4f" opacity=".06"/>
  <g transform="translate(812 130) rotate(8 165 165)" filter="url(#shadow)">
    <circle cx="165" cy="165" r="165" fill="#b96a2d"/>
    <circle cx="165" cy="165" r="145" fill="url(#pizza)"/>
    <path d="M165 165 165 20A145 145 0 0 1 290 238Z" fill="#f6c75c" opacity=".8"/>
    <path d="M165 165 290 238A145 145 0 0 1 66 271Z" fill="#f3bc48" opacity=".7"/>
    <path d="M165 165 66 271A145 145 0 0 1 165 20Z" fill="#f8cf6b" opacity=".8"/>
    <g fill="#b93737">
      <circle cx="124" cy="82" r="18"/><circle cx="219" cy="83" r="18"/>
      <circle cx="247" cy="167" r="18"/><circle cx="190" cy="238" r="18"/>
      <circle cx="100" cy="222" r="18"/><circle cx="86" cy="142" r="18"/>
    </g>
    <g fill="#4b7b48">
      <ellipse cx="162" cy="102" rx="9" ry="17" transform="rotate(35 162 102)"/>
      <ellipse cx="216" cy="193" rx="9" ry="17" transform="rotate(-20 216 193)"/>
      <ellipse cx="126" cy="184" rx="9" ry="17" transform="rotate(70 126 184)"/>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="86" fill="#e0ae4f" font-size="25" font-weight="700" letter-spacing="4">BORA VENDER+ • PIZZARIAS</text>
    <text x="67" y="244" fill="#ffffff" font-size="174" font-weight="800">12</text>
    <text x="74" y="313" fill="#ffffff" font-size="44" font-weight="800">CAMPANHAS ESTRATÉGICAS</text>
    <text x="74" y="367" fill="#ffffff" font-size="38" font-weight="700">PARA AUMENTAR O FATURAMENTO</text>
    <text x="74" y="417" fill="#e0ae4f" font-size="38" font-weight="700">DA SUA PIZZARIA</text>
    <text x="74" y="514" fill="#dce2f6" font-size="25">Por Fábio Alves</text>
    <text x="74" y="554" fill="#ffffff" font-size="23" font-weight="700">MUNDO DIGITAL SOLUÇÕES</text>
  </g>
