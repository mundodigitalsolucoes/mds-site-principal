<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Como fazer sua empresa aparecer no Google e nas pesquisas por IA</title>
  <desc id="desc">Capa editorial Bora Vender+ Edição Especial com notebook, busca e selo discreto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13213d"/>
      <stop offset="0.55" stop-color="#203d78"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset="0.4" stop-color="#f2c45b"/>
      <stop offset="1" stop-color="#b87909"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="170" r="210" fill="#2f7bff" opacity=".16" filter="url(#soft)"/>
  <circle cx="240" cy="740" r="220" fill="#1cc8ff" opacity=".08" filter="url(#soft)"/>

  <g transform="translate(112,132)">
    <text x="0" y="80" fill="#b9d9ff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="7">PRESENÇA DIGITAL</text>
    <rect x="0" y="105" width="92" height="4" rx="2" fill="#3fd4ff"/>
    <text x="0" y="235" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700">Como fazer sua empresa</text>
    <text x="0" y="322" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700">aparecer no <tspan fill="#f2c45b">Google</tspan></text>
    <text x="0" y="409" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700">e nas pesquisas por <tspan fill="#53c8ff">IA</tspan></text>
  </g>

  <g transform="translate(890,170) rotate(-3 270 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="545" height="390" rx="24" fill="#0c1527" stroke="#8ebcff" stroke-opacity=".5" stroke-width="3"/>
    <rect x="20" y="22" width="505" height="332" rx="14" fill="url(#screen)"/>
    <rect x="72" y="84" width="400" height="62" rx="31" fill="#fff" stroke="#dbe7f4" stroke-width="2"/>
    <circle cx="108" cy="115" r="13" fill="#4285F4"/>
    <circle cx="118" cy="105" r="6" fill="#EA4335"/>
    <circle cx="118" cy="125" r="6" fill="#34A853"/>
    <circle cx="98" cy="125" r="6" fill="#FBBC05"/>
    <text x="145" y="124" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="22">empresa perto de mim</text>
    <circle cx="445" cy="115" r="11" fill="none" stroke="#2563eb" stroke-width="4"/>
    <line x1="453" y1="123" x2="463" y2="133" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <rect x="70" y="182" width="250" height="18" rx="9" fill="#3b82f6" opacity=".85"/>
    <rect x="70" y="218" width="390" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="70" y="246" width="345" height="12" rx="6" fill="#dbe4ef"/>
    <rect x="70" y="286" width="210" height="18" rx="9" fill="#60a5fa" opacity=".75"/>
    <rect x="70" y="322" width="330" height="12" rx="6" fill="#d8e2ee"/>
    <path d="M-30 390h605l-58 52H28z" fill="#b8c7da"/>
    <path d="M210 390h135l-12 18H222z" fill="#8da1b8"/>
  </g>

  <g transform="translate(1280,500) rotate(-14)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#gold)" stroke-width="26"/>
    <line x1="68" y1="68" x2="160" y2="160" stroke="url(#gold)" stroke-width="32" stroke-linecap="round"/>
  </g>

  <g transform="translate(1365,88)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="70" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="58" fill="#172b51" stroke="#f2c45b" stroke-width="4"/>
    <text x="0" y="-12" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800">BORA VENDER+</text>
    <text x="0" y="18" text-anchor="middle" fill="#f2c45b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="2">EDIÇÃO</text>
    <text x="0" y="36" text-anchor="middle" fill="#f2c45b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="2">ESPECIAL</text>
  </g>

  <text x="112" y="825" fill="#8fb5df" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="5">MUNDO DIGITAL SOLUÇÕES</text>
</svg>
